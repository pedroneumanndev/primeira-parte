<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cacau Show - Entrada</title>
  <style>
    :root {
      --bg: #f4ede4;
      --shape: #43190a;
      --ink: #f3dfc9;
      --button: #43190a;
      --button-hover: #43190a;
    }
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
    }

    .background {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
    }

    .page-content {
      opacity: 0;
      transform: translateY(16px);
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    body.content-ready .page-content {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      pointer-events: auto;
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: auto;
      background: var(--bg);
    }

    .intro-circle {
      position: absolute;
      width: 150px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--shape);
      transform: scale(0.08);
      animation: introCircleGrow 2.9s cubic-bezier(0.2, 0.72, 0.2, 1) forwards;
    }

    .intro-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(120px, 34vw, 172px);
      height: auto;
      opacity: 0;
      transform: translate(-50%, calc(-50% + 20px)) scale(0.86);
      filter: brightness(0) invert(1);
      animation:
        introLogoReveal 0.7s ease 0.62s forwards,
        introLogoBounce 0.95s cubic-bezier(0.18, 0.88, 0.35, 1.15) 1.55s 1 forwards;
    }

    .intro.out {
      animation: introFadeOut 0.62s ease forwards;
      pointer-events: none;
    }

    @keyframes introCircleGrow {
      to {
        transform: scale(14);
      }
    }

    @keyframes introLogoReveal {
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes introLogoBounce {
      0% {
        transform: translate(-50%, -50%) scale(1);
      }
      40% {
        transform: translate(-50%, calc(-50% - 12px)) scale(1.04);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes introFadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }


    .screen {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      width: min(100%, 430px);
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 0;
    }

    .logo {
      width: clamp(108px, 32vw, 145px);
      height: auto;
      margin: clamp(58px, 9.8vh, 84px) auto clamp(44px, 6.4vh, 62px);
      align-self: center;
      margin-inline: auto;
      opacity: 1;
      display: block;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: contrast(1.08) saturate(1.06);
    }

    .title {
      margin: 0;
      text-align: left;
      align-self: flex-start;
      padding-left: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 8vw, 40px);
      line-height: 1.04;
      letter-spacing: 0;
      font-weight: 700;
      width: 100%;
      max-width: none;
      white-space: nowrap;
      margin-bottom: 4px;
      text-shadow: 0 1px 2px rgba(34, 15, 10, 0.35);
    }

    .subtitle {
      margin: 0;
      align-self: flex-start;
      padding-left: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 8vw, 40px);
      line-height: 1.04;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(34, 15, 10, 0.35);
    }

    .enter-btn {
      width: min(76%, 420px);
      align-self: center;
      margin-top: auto;
      margin-bottom: calc(18px + env(safe-area-inset-bottom));
      border: 0;
      border-radius: 45px;
      min-height: 82px;
      padding: 14px 28px;
      background: var(--button);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 7.1vw, 44px);
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      opacity: 0;
      transform: translateY(34px);
      transition:
        opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.2s ease;
      transition-delay: 0s;
      box-shadow: 0 5px 12px rgba(22, 10, 7, 0.2);
    }

    body.content-ready .enter-btn {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.85s;
    }

    .enter-btn:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .enter-btn:active {
      transform: translateY(1px);
    }

    @media (max-width: 520px) {
      .screen {
        width: 100%;
      }

      .title {
        margin-left: 72px;
      }

      .subtitle {
        margin-left: -10px;
      }

      .title,
      .subtitle {
        padding-left: 20px;
      }
    }

    @media (min-width: 521px) {
      .screen {
        padding-top: 56px;
        padding-bottom: 40px;
        align-items: center;
      }

      .logo {
        margin-top: 28px;
      }

      .title,
      .subtitle {
        text-align: center;
        align-self: center;
        padding-left: 0;
        width: 100%;
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro {
        display: none;
      }

      .page-content {
        opacity: 1;
        transform: none;
        transition: none;
      }

      .enter-btn {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }

  </style>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-circle"></div>
    <img class="intro-logo" src="imgs/cacau-show (1).svg" alt="" />
  </div>

  <svg class="background" viewBox="0 0 430 932" preserveAspectRatio="none" aria-hidden="true">
    <rect width="430" height="932" fill="var(--bg)" />
    <path
      fill="var(--shape)"
      d="M0,0H430V466C378,434 307,433 252,472C194,513 115,514 53,480C29,467 12,467 0,476Z"
    />
  </svg>

  <main class="screen page-content">
    <img
      class="logo"
      src="imgs/cacau-show (1).svg"
      alt="Logo Cacau Show"
    />

    <h1 class="title">Bem-vindo</h1>
    <h2 class="subtitle">Cacau Show Solid&aacute;ria</h2>

    <button class="enter-btn" id="startBtn" type="button">iniciar</button>
  </main>

  <script>
    (function () {
      var intro = document.getElementById("intro");
      var startBtn = document.getElementById("startBtn");
      if (startBtn) {
        startBtn.addEventListener("click", function () {
          window.location.href = "cadastro.html";
        });
      }

      if (!intro) return;

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) {
        document.body.classList.add("content-ready");
        intro.remove();
        return;
      }

      window.setTimeout(function () {
        intro.classList.add("out");

        window.setTimeout(function () {
          document.body.classList.add("content-ready");
          intro.remove();
        }, 620);
      }, 3600);
    })();
  </script>
</body>
</html>
