<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cacau Show - Entrada</title>
  <style>
    :root {
      --cream: #f4ede4;
      --brown: #4f2618;
      --ink: #f3dfc9;
      --button: #7a3d29;
      --button-hover: #8a4a34;
      --gallery-top: #5a2c1b;
      --gallery-bottom: #f2f2f4;
      --wave-time: 7s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--cream);
    }

    .intro-circle {
      position: absolute;
      width: 150px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--brown);
      transform: scale(0.08);
      animation: introCircleGrow 2.05s cubic-bezier(0.2, 0.72, 0.2, 1) forwards;
    }

    .intro-logo {
      position: relative;
      width: clamp(120px, 34vw, 172px);
      height: auto;
      opacity: 0;
      transform: translateY(20px) scale(0.86);
      filter: brightness(0) invert(1);
      animation:
        introLogoReveal 0.7s ease 0.62s forwards,
        introLogoBounce 0.95s cubic-bezier(0.18, 0.88, 0.35, 1.15) 1.55s 1 forwards;
    }

    .intro.out {
      animation: introFadeOut 0.62s ease forwards;
      pointer-events: none;
    }

    @keyframes introCircleGrow {
      to {
        transform: scale(14);
      }
    }

    @keyframes introLogoReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes introLogoBounce {
      0% {
        transform: translateY(0) scale(1);
      }
      40% {
        transform: translateY(-12px) scale(1.04);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes introFadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    .entry-view {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(12px);
      visibility: hidden;
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s ease;
    }

    body.intro-done .entry-view {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    body.show-gallery .entry-view {
      opacity: 0;
      transform: translateX(-8%);
      visibility: hidden;
      pointer-events: none;
    }

    .entry-shell {
      position: relative;
      width: min(100%, 430px);
      height: 100svh;
      max-height: 100svh;
      overflow: hidden;
      background: var(--cream);
    }

    .entry-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .entry-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      color: var(--ink);
    }

    .logo {
      width: clamp(108px, 32vw, 145px);
      height: auto;
      margin: calc(34px + env(safe-area-inset-top)) auto 36px;
      display: block;
      mix-blend-mode: multiply;
      filter: contrast(1.08) saturate(1.06);
    }

    .title {
      margin: 0;
      padding-inline: 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 11vw, 48px);
      line-height: 1;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(34, 15, 10, 0.35);
      white-space: nowrap;
    }

    .subtitle {
      margin: 2px 0 0;
      padding-inline: 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 7.1vw, 34px);
      line-height: 1.08;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(34, 15, 10, 0.35);
      white-space: nowrap;
    }

    .enter-btn {
      position: absolute;
      left: 50%;
      bottom: calc(34px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(76%, 360px);
      min-height: 74px;
      border: 0;
      border-radius: 42px;
      padding: 12px 26px;
      background: var(--button);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 8vw, 40px);
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(22, 10, 7, 0.2);
      opacity: 0;
      transition:
        opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.2s ease;
      transition-delay: 0s;
    }

    body.intro-done .enter-btn {
      opacity: 1;
      transform: translate(-50%, 0);
      transition-delay: 0.85s;
    }

    .enter-btn:hover {
      background: var(--button-hover);
    }

    .enter-btn:active {
      transform: translate(-50%, 1px);
    }

    .gallery-view {
      position: fixed;
      inset: 0;
      z-index: 15;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(12%);
      transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s ease;
      background: var(--gallery-bottom);
    }

    body.show-gallery .gallery-view {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(0);
    }

    .gallery-carousel {
      width: 100vw;
      height: 100svh;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .gallery-carousel::-webkit-scrollbar {
      display: none;
    }

    .gallery-slide {
      position: relative;
      flex: 0 0 100vw;
      width: 100vw;
      height: 100svh;
      scroll-snap-align: start;
      overflow: hidden;
      background: var(--gallery-bottom);
    }

    .gallery-top {
      position: relative;
      height: 53svh;
      background: var(--gallery-top);
      overflow: hidden;
    }

    .gallery-wave {
      position: absolute;
      left: -6%;
      width: 112%;
      bottom: -1px;
      height: 110px;
      animation: waveFloat var(--wave-time) ease-in-out infinite;
    }

    @keyframes waveFloat {
      0%,
      100% {
        transform: translateX(-18px);
      }
      50% {
        transform: translateX(18px);
      }
    }

    .art-wrap {
      position: absolute;
      left: 50%;
      top: calc(70px + env(safe-area-inset-top));
      transform: translateX(-50%);
      width: min(84vw, 360px);
      height: min(35vh, 360px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .art-wrap img {
      width: auto;
      max-width: 100%;
      max-height: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.18));
    }

    @media (prefers-reduced-motion: reduce) {
      .intro {
        display: none;
      }

      .entry-view {
        opacity: 1;
        transform: none;
        visibility: visible;
        transition: none;
      }

      .enter-btn {
        opacity: 1;
        transform: translate(-50%, 0);
        transition: none;
      }

      .gallery-view {
        transition: none;
      }

      .gallery-carousel {
        scroll-behavior: auto;
      }

      .gallery-wave {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-circle"></div>
    <img class="intro-logo" src="imgs/cacau-show (1).svg" alt="" />
  </div>

  <section class="entry-view" id="entryView" aria-label="Tela inicial">
    <div class="entry-shell">
      <svg class="entry-bg" viewBox="0 0 430 932" preserveAspectRatio="none" aria-hidden="true">
        <rect width="430" height="932" fill="var(--cream)" />
        <path
          fill="var(--brown)"
          d="M0,0H430V466C378,434 307,433 252,472C194,513 115,514 53,480C29,467 12,467 0,476Z"
        />
      </svg>

      <main class="entry-content">
        <img class="logo" src="imgs/cacau-show (1).svg" alt="Logo Cacau Show" />
        <h1 class="title">Bem-vindo</h1>
        <h2 class="subtitle">Cacau Show Solid&aacute;ria</h2>
        <button class="enter-btn" id="startBtn" type="button">iniciar</button>
      </main>
    </div>
  </section>

  <section class="gallery-view" id="galleryView" aria-label="Galeria lateral">
    <main class="gallery-carousel" id="galleryCarousel">
      <section class="gallery-slide">
        <div class="gallery-top">
          <div class="art-wrap">
            <img src="imgs/01cll.png" alt="Imagem 01" />
          </div>
          <svg class="gallery-wave" viewBox="0 0 760 120" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#f2f2f4" d="M0,62C86,44 173,44 260,62C340,79 420,80 500,64C586,46 673,46 760,62V120H0Z" />
          </svg>
        </div>
      </section>

      <section class="gallery-slide">
        <div class="gallery-top">
          <div class="art-wrap">
            <img src="imgs/loc.png" alt="Imagem localizacao" />
          </div>
          <svg class="gallery-wave" viewBox="0 0 760 120" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#f2f2f4" d="M0,62C86,44 173,44 260,62C340,79 420,80 500,64C586,46 673,46 760,62V120H0Z" />
          </svg>
        </div>
      </section>

      <section class="gallery-slide">
        <div class="gallery-top">
          <div class="art-wrap">
            <img src="imgs/sacola.png" alt="Imagem sacola" />
          </div>
          <svg class="gallery-wave" viewBox="0 0 760 120" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#f2f2f4" d="M0,62C86,44 173,44 260,62C340,79 420,80 500,64C586,46 673,46 760,62V120H0Z" />
          </svg>
        </div>
      </section>
    </main>
  </section>

  <script>
    (function () {
      var intro = document.getElementById("intro");
      var startBtn = document.getElementById("startBtn");
      var galleryCarousel = document.getElementById("galleryCarousel");

      if (startBtn) {
        startBtn.addEventListener("click", function () {
          document.body.classList.add("show-gallery");
          if (galleryCarousel) {
            galleryCarousel.scrollLeft = 0;
          }
        });
      }

      if (!intro) return;

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) {
        document.body.classList.add("intro-done");
        intro.remove();
        return;
      }

      window.setTimeout(function () {
        document.body.classList.add("intro-done");
        intro.classList.add("out");

        window.setTimeout(function () {
          intro.remove();
        }, 620);
      }, 3050);
    })();
  </script>
</body>
</html>
