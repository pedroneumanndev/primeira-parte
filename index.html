<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cacau Show - Entrada</title>
  <style>
    :root {
      --cream: #f4ede4;
      --brown: #4f2618;
      --ink: #f3dfc9;
      --button: #7a3d29;
      --button-hover: #8a4a34;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--cream);
    }

    .intro-circle {
      position: absolute;
      width: 150px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--brown);
      transform: scale(0.08);
      animation: introCircleGrow 2.05s cubic-bezier(0.2, 0.72, 0.2, 1) forwards;
    }

    .intro-logo {
      position: relative;
      width: clamp(120px, 34vw, 172px);
      height: auto;
      opacity: 0;
      transform: translateY(20px) scale(0.86);
      filter: brightness(0) invert(1);
      animation:
        introLogoReveal 0.7s ease 0.62s forwards,
        introLogoBounce 0.95s cubic-bezier(0.18, 0.88, 0.35, 1.15) 1.55s 1 forwards;
    }

    .intro.out {
      animation: introFadeOut 0.62s ease forwards;
      pointer-events: none;
    }

    @keyframes introCircleGrow {
      to {
        transform: scale(14);
      }
    }

    @keyframes introLogoReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes introLogoBounce {
      0% {
        transform: translateY(0) scale(1);
      }
      40% {
        transform: translateY(-12px) scale(1.04);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes introFadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    .entry-view {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(12px);
      visibility: hidden;
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s ease;
    }

    body.intro-done .entry-view {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .entry-shell {
      position: relative;
      width: min(100%, 430px);
      height: 100vh;
      min-height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      height: 100svh;
      max-height: 100svh;
      overflow: hidden;
      background: var(--cream);
    }

    .entry-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .entry-logo-wrap {
      position: absolute;
      z-index: 1;
      top: calc(34px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .logo {
      width: clamp(108px, 32vw, 145px);
      height: auto;
      display: block;
      mix-blend-mode: multiply;
      filter: contrast(1.08) saturate(1.06);
    }

    .entry-text-wrap {
      position: absolute;
      z-index: 1;
      top: calc(240px + env(safe-area-inset-top));
      left: 0;
      right: 0;
      color: var(--ink);
      pointer-events: none;
    }

    .title {
      margin: 0;
      padding-inline: 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 11vw, 48px);
      line-height: 1;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(34, 15, 10, 0.35);
      white-space: nowrap;
    }

    .subtitle {
      margin: 2px 0 0;
      padding-inline: 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 7.1vw, 34px);
      line-height: 1.08;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(34, 15, 10, 0.35);
      white-space: nowrap;
    }

    .entry-button-wrap {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      padding-inline: 16px;
    }

    .enter-btn {
      position: relative;
      width: min(76%, 360px);
      min-height: 74px;
      border: 0;
      border-radius: 42px;
      padding: 12px 26px;
      background: var(--button);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 8vw, 40px);
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(22, 10, 7, 0.2);
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.2s ease;
      transition-delay: 0s;
    }

    body.intro-done .enter-btn {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.85s;
    }

    .enter-btn:hover {
      background: var(--button-hover);
    }

    .enter-btn:active {
      transform: translateY(1px);
    }

    @media (prefers-reduced-motion: reduce) {
      .intro {
        display: none;
      }

      .entry-view {
        opacity: 1;
        transform: none;
        visibility: visible;
        transition: none;
      }

      .enter-btn {
        opacity: 1;
        transform: translateY(0);
        transition: none;
      }
    }

    @media (max-height: 760px) {
      .entry-logo-wrap {
        top: calc(22px + env(safe-area-inset-top));
      }

      .entry-text-wrap {
        top: calc(186px + env(safe-area-inset-top));
      }

      .entry-button-wrap {
        bottom: calc(10px + env(safe-area-inset-bottom));
      }

      .enter-btn {
        min-height: 62px;
        font-size: clamp(22px, 7vw, 34px);
      }
    }
  </style>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-circle"></div>
    <img class="intro-logo" src="imgs/cacau-show (1).svg" alt="" />
  </div>

  <section class="entry-view" id="entryView" aria-label="Tela inicial">
    <div class="entry-shell">
      <svg class="entry-bg" viewBox="0 0 430 932" preserveAspectRatio="none" aria-hidden="true">
        <rect width="430" height="932" fill="var(--cream)" />
        <path
          fill="var(--brown)"
          d="M0,0H430V466C378,434 307,433 252,472C194,513 115,514 53,480C29,467 12,467 0,476Z"
        />
      </svg>

      <div class="entry-logo-wrap">
        <img class="logo" src="imgs/cacau-show (1).svg" alt="Logo Cacau Show" />
      </div>

      <div class="entry-text-wrap">
        <h1 class="title">Bem-vindo</h1>
        <h2 class="subtitle">Cacau Show Solid&aacute;ria</h2>
      </div>

      <div class="entry-button-wrap">
        <button class="enter-btn" id="startBtn" type="button">iniciar</button>
      </div>
    </div>
  </section>

  <script>
    (function () {
      var intro = document.getElementById("intro");

      if (!intro) return;

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) {
        document.body.classList.add("intro-done");
        intro.remove();
        return;
      }

      window.setTimeout(function () {
        document.body.classList.add("intro-done");
        intro.classList.add("out");

        window.setTimeout(function () {
          intro.remove();
        }, 620);
      }, 3050);
    })();
  </script>
</body>
</html>
