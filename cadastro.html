<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cacau Show - Galeria</title>
  <style>
    :root {
      --top-brown: #5a2c1b;
      --bottom-bg: #f2f2f4;
      --wave-time: 7s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bottom-bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .carousel {
      width: 100vw;
      height: 100dvh;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .slide {
      position: relative;
      flex: 0 0 100vw;
      width: 100vw;
      height: 100dvh;
      scroll-snap-align: start;
      overflow: hidden;
      background: var(--bottom-bg);
    }

    .top-area {
      position: relative;
      height: 53dvh;
      background: var(--top-brown);
      overflow: hidden;
    }

    .wave {
      position: absolute;
      left: -6%;
      width: 112%;
      bottom: -1px;
      height: 110px;
      animation: waveFloat var(--wave-time) ease-in-out infinite;
    }

    @keyframes waveFloat {
      0%,
      100% {
        transform: translateX(-18px);
      }
      50% {
        transform: translateX(18px);
      }
    }

    .art-wrap {
      position: absolute;
      left: 50%;
      top: calc(70px + env(safe-area-inset-top));
      transform: translateX(-50%);
      width: min(84vw, 360px);
      height: min(35vh, 360px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .art-wrap img {
      width: auto;
      max-width: 100%;
      max-height: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.18));
    }

    @media (prefers-reduced-motion: reduce) {
      .carousel {
        scroll-behavior: auto;
      }

      .wave {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="carousel" aria-label="Galeria lateral">
    <section class="slide">
      <div class="top-area">
        <div class="art-wrap">
          <img src="imgs/01cll.png" alt="Imagem 01" />
        </div>
        <svg class="wave" viewBox="0 0 760 120" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#f2f2f4" d="M0,62C86,44 173,44 260,62C340,79 420,80 500,64C586,46 673,46 760,62V120H0Z" />
        </svg>
      </div>
    </section>

    <section class="slide">
      <div class="top-area">
        <div class="art-wrap">
          <img src="imgs/loc.png" alt="Imagem localizacao" />
        </div>
        <svg class="wave" viewBox="0 0 760 120" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#f2f2f4" d="M0,62C86,44 173,44 260,62C340,79 420,80 500,64C586,46 673,46 760,62V120H0Z" />
        </svg>
      </div>
    </section>

    <section class="slide">
      <div class="top-area">
        <div class="art-wrap">
          <img src="imgs/sacola.png" alt="Imagem sacola" />
        </div>
        <svg class="wave" viewBox="0 0 760 120" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#f2f2f4" d="M0,62C86,44 173,44 260,62C340,79 420,80 500,64C586,46 673,46 760,62V120H0Z" />
        </svg>
      </div>
    </section>
  </main>
</body>
</html>
